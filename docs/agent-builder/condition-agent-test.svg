<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#f8fafc"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#0f172a">Тест «Условие-агент»: срочное → Telegram, иначе → обычный ответ</text>
  <text x="40" y="74" font-size="15" fill="#475569">Агент сам отвечает «Да/Нет» на вопрос и направляет поток. В схеме есть настоящий агент — проверка перед запуском пройдёт.</text>

  <!-- connectors -->
  <path d="M190,168 L190,206" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M320,232 L466,230" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M722,230 L796,230" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M190,272 L190,392 L466,392" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <!-- branch chips ON the line -->
  <g font-size="13" font-weight="700">
    <rect x="372" y="212" width="34" height="20" rx="10" fill="#16a34a"/><text x="389" y="226" fill="#fff" text-anchor="middle">Да</text>
    <rect x="250" y="382" width="40" height="20" rx="10" fill="#dc2626"/><text x="270" y="396" fill="#fff" text-anchor="middle">Нет</text>
  </g>

  <!-- User Input -->
  <g>
    <rect x="60" y="106" width="260" height="62" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="60" y="106" width="6" height="62" rx="3" fill="#f59e0b"/>
    <text x="82" y="136" font-size="16" font-weight="700" fill="#0f172a">User Input</text>
    <text x="82" y="156" font-size="12.5" fill="#64748b">Старт · сюда пишешь сообщение</text>
  </g>
  <!-- Условие-агент -->
  <g>
    <rect x="60" y="208" width="260" height="64" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect x="60" y="208" width="6" height="64" rx="3" fill="#a855f7"/>
    <text x="82" y="236" font-size="16" font-weight="700" fill="#0f172a">Условие-агент &#10024;</text>
    <text x="82" y="256" font-size="12" fill="#7c3aed">вопрос: «Это срочное обращение?»</text>
  </g>
  <!-- Главный агент -->
  <g>
    <rect x="470" y="200" width="252" height="60" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <rect x="470" y="200" width="6" height="60" rx="3" fill="#2563eb"/>
    <text x="492" y="228" font-size="16" font-weight="700" fill="#0f172a">Главный агент</text>
    <text x="492" y="247" font-size="12" fill="#64748b">«Составь короткое срочное уведомление»</text>
  </g>
  <!-- Telegram -->
  <g>
    <rect x="800" y="200" width="300" height="60" rx="14" fill="#fff" stroke="#229ED9" stroke-width="2"/>
    <rect x="800" y="200" width="6" height="60" rx="3" fill="#229ED9"/>
    <text x="822" y="228" font-size="16" font-weight="700" fill="#0f172a">Telegram &#128680;</text>
    <text x="822" y="247" font-size="12" fill="#64748b">срочное → тебе в чат (75888153)</text>
  </g>
  <!-- Markdown -->
  <g>
    <rect x="470" y="362" width="300" height="60" rx="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <rect x="470" y="362" width="6" height="60" rx="3" fill="#64748b"/>
    <text x="492" y="390" font-size="16" font-weight="700" fill="#0f172a">Markdown Output</text>
    <text x="492" y="409" font-size="12" fill="#64748b">не срочное → обычный ответ</text>
  </g>

  <!-- panel -->
  <g>
    <rect x="800" y="300" width="360" height="280" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="824" y="332" font-size="15" font-weight="700" fill="#0f172a">Как проверить</text>
    <text x="824" y="360" font-size="12.5" fill="#334155" font-weight="700">Связи:</text>
    <text x="824" y="380" font-size="12.5" fill="#475569">User Input → Условие-агент</text>
    <text x="824" y="398" font-size="12.5" fill="#16a34a">Да → Главный агент → Telegram</text>
    <text x="824" y="416" font-size="12.5" fill="#dc2626">Нет → Markdown Output</text>

    <text x="824" y="446" font-size="12.5" fill="#334155" font-weight="700">Тест 1 (ждём «Да»):</text>
    <text x="824" y="464" font-size="12.5" fill="#475569">«Сайт упал, клиенты не могут оплатить!»</text>
    <text x="824" y="480" font-size="12" fill="#94a3b8">→ агент: Да → придёт в Telegram</text>

    <text x="824" y="508" font-size="12.5" fill="#334155" font-weight="700">Тест 2 (ждём «Нет»):</text>
    <text x="824" y="526" font-size="12.5" fill="#475569">«Подскажите часы работы»</text>
    <text x="824" y="542" font-size="12" fill="#94a3b8">→ агент: Нет → обычный ответ (Markdown)</text>

    <text x="824" y="568" font-size="11.5" fill="#94a3b8">Один раз: deploy builder-execute</text>
  </g>
</svg>
